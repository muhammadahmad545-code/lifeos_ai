name: lifeos
description: LifeOS, an offline personal organizer for tasks, notes, calendar, habits, journal, expenses, goals and focus.
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  basalt:
    git:
      url: https://github.com/muhammadahmad545-code/basalt-flutter.git
      ref: v0.1.0
  flutter_riverpod: ^2.6.1
  drift: ^2.30.0
  drift_flutter: ^0.2.5
  sqlite3_flutter_libs: ^0.5.34
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.0
  local_auth: ^2.3.0
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.30.0

flutter:
  uses-material-design: true
