name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute version
        id: version
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          VERSION_NAME="0.1.${BUILD_NUMBER}"
          TAG="v${VERSION_NAME}"
          {
            echo "build_number=${BUILD_NUMBER}"
            echo "version_name=${VERSION_NAME}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Prepare release assets
        id: assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 <<'PY'
          import json, os, shutil
          version_name = os.environ["VERSION_NAME"]
          build_number = int(os.environ["BUILD_NUMBER"])
          commit_msg = (os.environ.get("COMMIT_MSG") or "Manual release").strip()
          notes = f"LIFEOS AI {version_name}\n\nCommit: {os.environ['COMMIT_SHA']}\n\n{commit_msg}"
          out_dir = "build/app/outputs/flutter-apk"
          apk_name = f"lifeos-ai-{version_name}.apk"
          shutil.copyfile(f"{out_dir}/app-release.apk", f"{out_dir}/{apk_name}")
          with open(f"{out_dir}/version.json", "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "versionCode": build_number,
                      "versionName": version_name,
                      "notes": notes,
                      "apkFileName": apk_name,
                  },
                  f,
                  indent=2,
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"apk_name={apk_name}\n")
              out.write("notes<<EOF\n")
              out.write(notes)
              out.write("\nEOF\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LIFEOS AI ${{ steps.version.outputs.version_name }}
          body: ${{ steps.assets.outputs.notes }}
          files: |
            build/app/outputs/flutter-apk/${{ steps.assets.outputs.apk_name }}
            build/app/outputs/flutter-apk/version.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
